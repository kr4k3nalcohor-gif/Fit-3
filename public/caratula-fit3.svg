<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="32" />
  <circle cx="256" cy="256" r="230" fill="url(#glow)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1E293B" stroke-width="3" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#accent)" stroke-width="4" />

  <!-- Header -->
  <text x="256" y="70" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" letter-spacing="3" text-anchor="middle">PULSEFIT • GALAXY FIT 3</text>

  <!-- Center Wave -->
  <path d="M 120 256 Q 160 210, 200 256 T 280 256 T 360 256 T 400 256" fill="none" stroke="#F43F5E" stroke-width="4" opacity="0.4" />

  <!-- Central Tempo Number -->
  <text x="256" y="270" fill="#FFFFFF" font-family="monospace, system-ui" font-size="110" font-weight="900" text-anchor="middle">160</text>
  <text x="256" y="315" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" letter-spacing="4" text-anchor="middle">BPM • EN RITMO</text>

  <!-- Beat Indicator Dots -->
  <circle cx="211" cy="355" r="9" fill="#F43F5E" />
  <circle cx="241" cy="355" r="6" fill="#334155" />
  <circle cx="271" cy="355" r="6" fill="#334155" />
  <circle cx="301" cy="355" r="6" fill="#334155" />

  <!-- Footer Tag -->
  <text x="256" y="440" fill="#F43F5E" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" letter-spacing="2" text-anchor="middle">RUNNING CADENCE • 4/4</text>
</svg>
