<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="12" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ring)" stroke-width="12" stroke-dasharray="800" stroke-dashoffset="240" stroke-linecap="round" filter="url(#glow)" />
  <!-- Metronome Pendulum & Pulse wave -->
  <path d="M256 120 L220 370 L292 370 Z" fill="#1e293b" stroke="#334155" stroke-width="6" stroke-linejoin="round" />
  <line x1="256" y1="350" x2="256" y2="170" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" />
  <rect x="236" y="210" width="40" height="28" rx="6" fill="#fb7185" filter="url(#glow)" />
  <!-- Pulse wave marks -->
  <path d="M120 256 C150 256 170 200 190 310 C210 190 230 310 256 256 C280 256 300 210 320 290 C340 230 360 256 392 256" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <circle cx="256" cy="350" r="10" fill="#f43f5e" />
</svg>
